  function formatFromPhp(phpAmount) {
    if (phpAmount === null || phpAmount === undefined) return 'Custom Quote';
    const cfg = CURRENCY_CONFIG[activeCurrency] || CURRENCY_CONFIG.PHP;
    const converted = phpAmount * cfg.rateFromPhp;
    const formatted = converted.toLocaleString('en-US', {
      minimumFractionDigits: cfg.decimals,
      maximumFractionDigits: cfg.decimals
    });
    return `${cfg.symbol}${formatted}`;
  }

  function setMainMode(mode) {
    activeMainMode = mode;
    const localBtn = document.getElementById('mainTabLocal');
    const intlBtn = document.getElementById('mainTabIntl');

    if (mode === 'LOCAL') {
      localBtn.className = 'px-5 py-2 rounded-xl text-xs font-extrabold transition-all bg-brand-500 text-white shadow-2xs cursor-pointer';
      intlBtn.className = 'px-5 py-2 rounded-xl text-xs font-extrabold transition-all text-slate-700 hover:bg-white cursor-pointer';
    } else {
      intlBtn.className = 'px-5 py-2 rounded-xl text-xs font-extrabold transition-all bg-brand-500 text-white shadow-2xs cursor-pointer';
      localBtn.className = 'px-5 py-2 rounded-xl text-xs font-extrabold transition-all text-slate-700 hover:bg-white cursor-pointer';
    }

    const tabs = DESTINATION_TABS[mode] || [];
    activeSubTab = tabs[0] ? tabs[0].tabId : '';
    renderSubTabs();
    renderDestinationCards();
  }

  function setSubTab(tabId) {
    activeSubTab = tabId;
    renderSubTabs();
    renderDestinationCards();
  }

  function renderSubTabs() {
    const container = document.getElementById('subTabsContainer');
    const tabs = DESTINATION_TABS[activeMainMode] || [];
    container.innerHTML = tabs.map(t => {
      const isActive = t.tabId === activeSubTab;
      const cls = isActive
        ? 'bg-navy-900 text-white shadow-2xs'
        : 'bg-slate-100 text-slate-700 hover:bg-slate-200/70';
      return `<button type="button" onclick="setSubTab('${t.tabId}')" class="px-3.5 py-2 rounded-xl text-xs font-extrabold whitespace-nowrap transition-all cursor-pointer ${cls}">${t.tabLabel}</button>`;
    }).join('');
  }

  function renderDestinationCards() {
    const grid = document.getElementById('destinationCardsGrid');
    const tabs = DESTINATION_TABS[activeMainMode] || [];
    const currentTab = tabs.find(t => t.tabId === activeSubTab) || tabs[0];
    const items = currentTab ? currentTab.items : [];

    grid.innerHTML = items.map(item => {
      const actionBtn = item.regionFilter && item.regionFilter !== 'ALL'
        ? `<a href="#packages" onclick="setPackageRegion('${item.regionFilter}')" class="inline-flex items-center gap-1 text-xs font-extrabold text-brand-600 hover:text-brand-700">View Published Rates →</a>`
        : `<a href="#quote-section" class="inline-flex items-center gap-1 text-xs font-extrabold text-brand-600 hover:text-brand-700">Request Custom Quote →</a>`;

      return `
        <article class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-2xs flex flex-col justify-between hover:border-brand-300 transition-all">
          <div>
            <div class="relative h-44 bg-slate-200 overflow-hidden">
              <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover" />
              <span class="absolute top-3 left-3 px-2.5 py-1 rounded-lg bg-navy-950/85 text-white text-[10px] font-extrabold tracking-wide">
                ${item.badge}
              </span>
            </div>
            <div class="p-4 space-y-2.5">
              <div>
                <h3 class="text-base font-extrabold text-navy-900">${item.title}</h3>
                <p class="text-xs text-slate-500">${item.subtitle}</p>
              </div>
              <ul class="space-y-1 text-xs text-slate-700 pt-1">
                ${item.highlights.map(h => `<li class="flex items-center gap-1.5"><span class="text-brand-500 font-bold">•</span><span>${h}</span></li>`).join('')}
              </ul>
            </div>
          </div>
          <div class="px-4 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
            ${actionBtn}
          </div>
        </article>
      `;
    }).join('');
  }

  function setPackageRegion(region) {
    activePackageRegion = region;
    const map = {
      ALL: 'pkgFilterAll',
      CORON: 'pkgFilterCoron',
      EL_NIDO: 'pkgFilterElNido',
      PUERTO: 'pkgFilterPuerto',
      COMBO: 'pkgFilterCombo',
      BALABAC: 'pkgFilterBalabac'
    };

    Object.entries(map).forEach(([key, id]) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.className = key === region
        ? 'px-3.5 py-1.5 rounded-xl text-xs font-bold bg-navy-900 text-white cursor-pointer'
        : 'px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 cursor-pointer';
    });

    renderPackages();
  }

  function renderPackages() {
    const grid = document.getElementById('packagesGrid');
    const filtered = activePackageRegion === 'ALL'
      ? PACKAGES_DATA
      : PACKAGES_DATA.filter(p => p.region === activePackageRegion);

    grid.innerHTML = filtered.map(pkg => {
      const tiersHtml = pkg.tiers.map(t => `
        <div class="flex items-center justify-between py-1.5 px-2.5 rounded-xl bg-slate-50 border border-slate-200/80 text-xs">
          <span class="font-bold text-slate-700">${t.label}</span>
          <span class="font-extrabold text-brand-600">${formatFromPhp(t.php)}<span class="text-[10px] font-semibold text-slate-400">/pax</span></span>
        </div>
      `).join('');

      return `
        <article class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs flex flex-col justify-between space-y-4">
          <div class="space-y-3">
            <div class="inline-block px-2.5 py-0.5 rounded-full bg-brand-50 border border-brand-200 text-brand-700 text-[10px] font-extrabold">
              ${pkg.tag}
            </div>
            <h3 class="text-base font-extrabold text-navy-900 leading-snug">${pkg.title}</h3>
            <p class="text-[11px] text-slate-600 leading-relaxed">${pkg.itinerary}</p>
            <div class="space-y-1.5 pt-1">
              ${tiersHtml}
            </div>
          </div>
          <div class="pt-2 border-t border-slate-100 space-y-2">
            <p class="text-[10px] text-slate-500 leading-snug">${pkg.note}</p>
            <a
              href="#quote-section"
              onclick="prefillQuotePackage('${pkg.title.replace(/'/g, "\\'")}')"
              class="block w-full text-center py-2 rounded-xl bg-navy-900 hover:bg-navy-800 text-white text-xs font-extrabold transition-colors"
            >
              Inquire / Quote This Package
            </a>
          </div>
        </article>
      `;
    }).join('');
  }

  function prefillQuotePackage(pkgTitle) {
    const notesEl = document.getElementById('otherNotesInput');
    if (notesEl && !notesEl.value.includes(pkgTitle)) {
      notesEl.value = notesEl.value ? `${notesEl.value}\nPackage: ${pkgTitle}` : `Package: ${pkgTitle}`;
      updateQuotePreview();
    }
  }

  function getQuoteSummaryText() {
    const dates = document.getElementById('travelDatesInput')?.value.trim() || 'Not specified';
    const priceMatch = document.getElementById('priceMatchInput')?.value.trim() || 'None';
    const notes = document.getElementById('otherNotesInput')?.value.trim() || 'None';
    const currencyLabel = CURRENCY_CONFIG[activeCurrency].label;

    return [
      'QUOTE FOR ALVIR (09163345946 / alvirestrella08@gmail.com)',
      `Travel Dates: ${dates}`,
      `Display Currency: ${currencyLabel}`,
      `Price Match: ${priceMatch}`,
      `Notes / Requests: ${notes}`
    ].join('\n');
  }

  function updateQuotePreview() {
    const datesEl = document.getElementById('previewDates');
    const currEl = document.getElementById('previewCurrency');
    const matchEl = document.getElementById('previewPriceMatch');
    const notesEl = document.getElementById('previewNotes');

    if (datesEl) datesEl.textContent = document.getElementById('travelDatesInput')?.value.trim() || 'Not specified';
    if (currEl) currEl.textContent = CURRENCY_CONFIG[activeCurrency].label;
    if (matchEl) matchEl.textContent = document.getElementById('priceMatchInput')?.value.trim() || 'None';
    if (notesEl) notesEl.textContent = document.getElementById('otherNotesInput')?.value.trim() || 'None';
  }

  function copyQuoteSummary() {
    const text = getQuoteSummaryText();
    const btn = document.getElementById('copyQuoteBtn');
    const oldText = btn ? btn.textContent : 'Copy';

    navigator.clipboard?.writeText(text).then(() => {
      if (btn) {
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = oldText; }, 1500);
      }
    }).catch(() => {
      alert(text);
    });
  }

  setMainMode('LOCAL');
  renderPackages();
  updateQuotePreview();
  setCurrency('PHP');
</script>
